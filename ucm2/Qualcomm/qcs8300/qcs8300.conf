Syntax 4

Define.DMI_info "${sys:devices/virtual/dmi/id/board_vendor}-${sys:devices/virtual/dmi/id/board_name}"

#MONACO EVK Board
If.MONACOEVK {
      Condition {
          Type RegexMatch
          String "${var:DMI_info}"
          Regex "qcom.*Inc\. Monaco EVK"
      }
      True.Include.monaco.File "/Qualcomm/qcs8300/MONACO-EVK.conf"
}
